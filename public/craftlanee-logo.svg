<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60" fill="none">
  <!-- Minimalist Dot-Matrix CraftLanee Wordmark -->
  <style>
    .brand-text {
      font-family: 'Silkscreen', 'Space Mono', monospace, sans-serif;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 4px;
      fill: #ffffff;
    }
    .led-dot {
      fill: #D71921;
      filter: drop-shadow(0 0 4px rgba(215, 25, 33, 0.8));
    }
  </style>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 14)">
    <rect x="0" y="0" width="32" height="32" rx="6" fill="#0c0c0c" stroke="#242424" stroke-width="1.5" />
    <!-- Dot-matrix grid C -->
    <circle cx="10" cy="11" r="2" fill="#ffffff" />
    <circle cx="16" cy="11" r="2" fill="#ffffff" />
    <circle cx="10" cy="16" r="2" fill="#ffffff" />
    <circle cx="10" cy="21" r="2" fill="#ffffff" />
    <circle cx="16" cy="21" r="2" fill="#ffffff" />
    <!-- Signature Nothing OS Red LED Point -->
    <circle cx="22" cy="11" r="2.5" class="led-dot" />
  </g>

  <!-- Brand Typography -->
  <text x="56" y="36" class="brand-text">CRAFTLANEE</text>
  <!-- Final dot accent -->
  <circle cx="282" cy="33" r="3" class="led-dot" />
</svg>
